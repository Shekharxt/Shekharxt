<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <!-- Refined Obsidian Background -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Subtle Slate Hairline Border -->
    <linearGradient id="hairline-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Subtle Soft Ambient Accent -->
    <radialGradient id="soft-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.2s infinite;
      fill: #38bdf8;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.5px;
      fill: #f8fafc;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .cli-text {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 12.5px;
      fill: #cbd5e1;
    }
    .cli-dim {
      fill: #64748b;
    }
    .cli-cyan {
      fill: #38bdf8;
    }
    .cli-green {
      fill: #34d399;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Chassis Card -->
  <rect width="850" height="180" rx="12" fill="url(#obsidian-bg)" stroke="url(#hairline-border)" stroke-width="1" />
  
  <!-- Gentle Ambient Azure Lighting -->
  <rect width="850" height="180" rx="12" fill="url(#soft-glow)" />

  <!-- macOS / Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <!-- Window Dots (Muted, Elegant) -->
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="28" cy="0" r="4.5" fill="#10b981" fill-opacity="0.8" />
    
    <!-- Environment breadcrumb -->
    <text x="50" y="3.5" font-family="'SF Mono', monospace" font-size="11" fill="#475569" font-weight="500">
      shekhar@azure-cloud: ~ / enterprise-landing-zone
    </text>

    <!-- Top Right Status Pill -->
    <g transform="translate(640, -8)">
      <rect width="162" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="11" cy="11" r="3.5" fill="#10b981" />
      <text x="21" y="14.5" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">
        3.5+ YRS DEVOPS EXP
      </text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="36" x2="826" y2="36" stroke="#1e293b" stroke-width="0.75" />

  <!-- Main Content Body -->
  <g transform="translate(26, 70)">
    <!-- Identity -->
    <text x="0" y="0" class="main-title">Shekhar</text>
    <text x="132" y="-1" class="role-title">— Cloud Infrastructure &amp; DevSecOps Engineer</text>

    <!-- Terminal Execution Line -->
    <g transform="translate(0, 32)">
      <text x="0" y="0" class="cli-text">
        <tspan class="cli-green">➜</tspan> <tspan class="cli-cyan">cloud</tspan> <tspan class="cli-dim">git:(</tspan><tspan fill="#f43f5e">main</tspan><tspan class="cli-dim">)</tspan> <tspan fill="#e2e8f0">terraform apply</tspan> <tspan class="cli-dim">-target=module.enterprise_landing_zone</tspan>
      </text>
      <rect x="585" y="-11" width="7" height="14" class="cursor" />
    </g>

    <!-- Output summary line -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" class="cli-text" font-size="11.5">
        <tspan class="cli-dim">Plan: 100+ workloads migrated, 0 to destroy. Status:</tspan> <tspan class="cli-green">✓ Infrastructure Healthy &amp; Governed</tspan>
      </text>
    </g>

    <!-- Minimalist Badges Row -->
    <g transform="translate(0, 72)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="128" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="9" y="14" class="tag-text">Azure CAF &amp; Hub-Spoke</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(136, 0)">
        <rect width="112" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="9" y="14" class="tag-text">Terraform / OpenTofu</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(256, 0)">
        <rect width="122" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="9" y="14" class="tag-text">DevSecOps &amp; CI/CD</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(386, 0)">
        <rect width="98" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="9" y="14" class="tag-text">Kubernetes AKS</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(492, 0)">
        <rect width="126" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="9" y="14" class="tag-text">FinOps &amp; Observability</text>
      </g>
    </g>
  </g>
</svg>
